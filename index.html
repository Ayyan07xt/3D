<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenZfoods | Ajara Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --gold: #D4AF37; --black: #050505; --bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* PREMIUM PNG SPLASH ANIMATION */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 9999; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .png-food { width: 180px; position: absolute; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); z-index: 10; }
        
        /* Animation Sequence */
        .burger-png { animation: floatInLeft 1.5s ease-out forwards; }
        .pizza-png { animation: floatInRight 1.5s ease-out forwards; }
        .splash-logo { opacity: 0; transform: scale(0.8); animation: logoPop 0.8s 1.2s ease-out forwards; text-align: center; }

        @keyframes floatInLeft { 
            0% { transform: translateX(-250px) rotate(-45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(400px) rotate(20deg); opacity: 0; } 
        }
        @keyframes floatInRight { 
            0% { transform: translateX(250px) rotate(45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-400px) rotate(-20deg); opacity: 0; } 
        }
        @keyframes logoPop { 
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); } 
        }

        /* MAIN UI */
        header { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 15px 20px; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: var(--gold); }

        .container { padding: 20px; }
        .hotel-card { background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.06); margin-bottom: 25px; border: 1px solid #f0f0f0; }
        .hotel-card img { width: 100%; height: 200px; object-fit: cover; }
        .h-info { padding: 20px; position: relative; }
        .rating { position: absolute; top: -20px; right: 20px; background: var(--gold); color: white; padding: 6px 15px; border-radius: 12px; font-weight: 800; }

        .dish-card { display: flex; padding: 15px; margin-bottom: 12px; background: #fcfcfc; border-radius: 20px; align-items: center; gap: 15px; border: 1px solid #eee; }
        .dish-img { width: 85px; height: 85px; border-radius: 15px; object-fit: cover; }
        .add-btn { background: var(--black); color: var(--gold); border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        /* TOAST */
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #111; color: white; padding: 15px 20px; border-radius: 20px; display: none; width: 90%; justify-content: space-between; align-items: center; z-index: 2000; border: 1px solid var(--gold); }
        .toast-btn { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 10px; font-weight: 900; font-size: 12px; }

        /* ORDER BOX */
        .order-btn { width: 100%; background: #25D366; color: white; padding: 20px; border-radius: 20px; border: none; font-weight: 900; font-size: 18px; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        textarea { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #ddd; font-size: 16px; margin-top: 10px; height: 100px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { color: #ccc; text-align: center; border: none; background: none; font-size: 11px; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://www.freeiconspng.com/uploads/burger-png-15.png" class="png-food burger-png">
        <img src="https://www.freeiconspng.com/uploads/pizza-png-15.png" class="png-food pizza-png">
        
        <div class="splash-logo">
            <h1 style="color:white; font-size:40px; font-weight:900;">GenZ<span style="color:var(--gold)">foods</span></h1>
            <p style="color:var(--gold); letter-spacing:5px;">AJARA</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <div class="logo">GenZ<span>foods</span></div>
            <div style="font-size: 12px; font-weight: 700; color: var(--gold);">PREMIUM DELIVERY</div>
        </header>

        <section id="home-page" class="container">
            <div style="background:var(--black); padding:30px; border-radius:30px; color:white; margin-bottom:25px;">
                <h2 style="color:var(--gold); font-size:28px;">GenZ Ajara ✨</h2>
                <p style="opacity:0.8;">Taste the best at your door.</p>
            </div>
            <h3 style="margin-bottom:15px; font-weight:900;">Local Favorites (20)</h3>
            <div id="hotel-list"></div>
        </section>

        <section id="menu-page" class="hidden"></section>

        <section id="cart-page" class="container hidden">
            <h2 style="font-weight:900; margin-bottom:15px;">Finalize Order</h2>
            <div id="cart-items" style="background:#f9f9f9; border-radius:20px; padding:15px;"></div>
            <h4 style="margin-top:20px;">Delivery Address</h4>
            <textarea id="address" placeholder="Ghar ka address aur landmark likho..."></textarea>
            <div id="total-val" style="font-size:24px; font-weight:900; text-align:right; margin:20px 0;"></div>
            <button class="order-btn" onclick="app.placeOrder()"><i class="fab fa-whatsapp"></i> PLACE ORDER ON WHATSAPP</button>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.nav('home-page')"><i class="fa fa-home"></i>Home</button>
            <button class="nav-item" onclick="app.nav('cart-page')"><i class="fa fa-shopping-bag"></i>Bag</button>
            <button class="nav-item" onclick="location.reload()"><i class="fa fa-refresh"></i>Refresh</button>
        </nav>
    </div>

    <div id="toast">
        <span style="font-weight:700;">Added to Bag!</span>
        <div class="toast-btn" onclick="app.nav('cart-page')">GO TO BAG</div>
    </div>

    <script>
        // 20 HOTELS DATA
        const HOTELS = Array.from({length: 20}, (_, i) => ({
            id: i+1,
            name: ["Burger Club", "Pizza Palace", "Ajara Biryani", "Cafe Coffee", "Roll Mania", "Sweet Sin", "Desi Dhaba", "Sushi House", "Waffle World", "Grill Steak", "Momo Point", "Pasta Hub", "Juice Bar", "Royal Thali", "Chai Sutta", "The Bakery", "South Tiffin", "Kabab Korner", "Salad Bar", "Ice Creamy"][i % 20],
            img: `https://images.unsplash.com/photo-${[1571091718767, 1513104890138, 1589302168068, 1509042239860, 1534353436294][i % 5]}?w=500`
        }));

        const app = {
            cart: [],
            currentHotel: null,
            userLocation: "Location not shared",

            init() {
                // Get Location Early
                this.getLocation();

                // Splash Timer
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    this.renderHotels();
                }, 2200);
            },

            getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        this.userLocation = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
                    }, (error) => {
                        console.log("Location Denied");
                    });
                }
            },

            renderHotels() {
                const list = document.getElementById('hotel-list');
                list.innerHTML = HOTELS.map(h => `
                    <div class="hotel-card animate__animated animate__fadeInUp" onclick="app.openMenu(${h.id})">
                        <img src="${h.img}">
                        <div class="h-info">
                            <span class="rating">★ 4.${(h.id%5)+4}</span>
                            <h4 style="font-weight:900; font-size:18px;">${h.name}</h4>
                            <p style="font-size:12px; color:#777;">Premium Ajara Experience</p>
                        </div>
                    </div>
                `).join('');
            },

            openMenu(id) {
                const hotel = HOTELS.find(h => h.id == id);
                this.currentHotel = hotel;
                let dishes = "";
                for(let i=1; i<=20; i++) {
                    const price = 100 + (i*10);
                    dishes += `
                        <div class="dish-card">
                            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200" class="dish-img">
                            <div style="flex:1">
                                <h4 style="font-size:14px; font-weight:700;">${hotel.name.split(' ')[0]} Spec. #${i}</h4>
                                <b style="color:var(--gold)">₹${price}</b>
                            </div>
                            <button class="add-btn" onclick="app.add('${hotel.name.split(' ')[0]} #${i}', ${price})">ADD +</button>
                        </div>
                    `;
                }
                document.getElementById('menu-page').innerHTML = `
                    <div style="padding:20px; background:var(--black); color:white; display:flex; align-items:center; gap:15px;">
                        <i class="fa fa-arrow-left" onclick="app.nav('home-page')"></i>
                        <h2 style="font-size:18px;">${hotel.name} Menu</h2>
                    </div>
                    <div class="container">${dishes}</div>
                `;
                this.nav('menu-page');
            },

            add(n, p) {
                this.cart.push({n, p, h: this.currentHotel.name});
                const t = document.getElementById('toast');
                t.style.display = 'flex';
                setTimeout(() => t.style.display = 'none', 3000);
            },

            nav(id) {
                ['home-page', 'menu-page', 'cart-page'].forEach(p => document.getElementById(p).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
                if(id === 'cart-page') this.renderCart();
                window.scrollTo(0,0);
            },

            renderCart() {
                const box = document.getElementById('cart-items');
                const val = document.getElementById('total-val');
                if(this.cart.length === 0) { box.innerHTML = "Your bag is empty!"; val.innerHTML = ""; return; }
                box.innerHTML = this.cart.map((item, i) => `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                        <div><b>${item.n}</b><br><small>${item.h}</small></div>
                        <b>₹${item.p} <i class="fa fa-trash" style="color:red; margin-left:10px;" onclick="app.remove(${i})"></i></b>
                    </div>
                `).join('');
                val.innerText = `Total: ₹${this.cart.reduce((s, i) => s + i.p, 0)}`;
            },

            remove(i) { this.cart.splice(i, 1); this.renderCart(); },

            placeOrder() {
                const addr = document.getElementById('address').value;
                if(!addr) return alert("Bhai address likho pehle!");
                
                const items = this.cart.map(i => `• ${i.n} (${i.h}) - ₹${i.p}`).join('\n');
                const total = this.cart.reduce((s, i) => s + i.p, 0);
                
                const msg = `*GenZfoods Ajara - Order Details*\n---\n*Items:*\n${items}\n\n*Grand Total:* ₹${total}\n\n*Address:* ${addr}\n\n*Live Location:* ${this.userLocation}\n\n_Bhai QR bhej do payment ke liye!_`;
                
                window.open(`https://wa.me/917757007795?text=${encodeURIComponent(msg)}`);
            }
        };

        app.init();
    </script>
</body>
</html>
