<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenZfoods | Ajara Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --gold: #D4AF37; --black: #050505; --bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* PREMIUM PNG SPLASH ANIMATION */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 9999; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .png-food { 
            width: 200px; 
            height: auto;
            position: absolute; 
            filter: drop-shadow(0 20px 40px rgba(255,255,255,0.1)); 
            z-index: 10; 
            opacity: 0;
        }
        
        /* Fixed Reliable PNG Links & Animation Sequence */
        .burger-png { 
            animation: floatInLeft 2s ease-in-out forwards; 
        }
        .pizza-png { 
            animation: floatInRight 2s ease-in-out forwards; 
        }
        
        .splash-logo { 
            opacity: 0; 
            transform: scale(0.8); 
            animation: logoPop 1s 1.7s ease-out forwards; 
            text-align: center; 
            z-index: 20; 
            position: relative;
        }

        @keyframes floatInLeft { 
            0% { transform: translate(-300px, -50px) rotate(-30deg) scale(0.5); opacity: 0; }
            50% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1.1); }
            100% { transform: translate(400px, 50px) rotate(30deg) scale(0.5); opacity: 0; } 
        }
        @keyframes floatInRight { 
            0% { transform: translate(300px, 50px) rotate(30deg) scale(0.5); opacity: 0; }
            50% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1.1); }
            100% { transform: translate(-400px, -50px) rotate(-30deg) scale(0.5); opacity: 0; } 
        }
        @keyframes logoPop { 
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); } 
        }

        /* MAIN UI */
        header { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 15px 20px; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: var(--gold); }

        .container { padding: 15px; }
        .hotel-card { background: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.06); margin-bottom: 25px; border: 1px solid #f0f0f0; }
        .hotel-card img { width: 100%; height: 180px; object-fit: cover; }
        .h-info { padding: 15px; position: relative; }
        .rating { position: absolute; top: -15px; right: 15px; background: var(--gold); color: white; padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; }

        .dish-card { display: flex; padding: 12px; margin-bottom: 12px; background: #fff; border-radius: 20px; align-items: center; gap: 12px; border: 1px solid #eee; }
        .dish-img { width: 80px; height: 80px; border-radius: 15px; object-fit: cover; }
        .add-btn { background: var(--black); color: var(--gold); border: none; padding: 10px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        /* TOAST */
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #111; color: white; padding: 15px 20px; border-radius: 20px; display: none; width: 90%; justify-content: space-between; align-items: center; z-index: 2000; border: 1px solid var(--gold); }
        .toast-btn { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 10px; font-weight: 900; font-size: 12px; }

        .order-btn { width: 100%; background: #25D366; color: white; padding: 20px; border-radius: 20px; border: none; font-weight: 900; font-size: 18px; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        textarea { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #ddd; font-size: 16px; margin-top: 10px; height: 100px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { color: #ccc; text-align: center; border: none; background: none; font-size: 11px; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://assets.stickpng.com/images/580b57fcd9996e24bc43c1a8.png" class="png-food burger-png" alt="Burger">
        <img src="https://assets.stickpng.com/images/580b57fcd9996e24bc43c1ee.png" class="png-food pizza-png" alt="Pizza">
        
        <div class="splash-logo">
            <h1 style="color:white; font-size:38px; font-weight:900;">GenZ<span style="color:var(--gold)">foods</span></h1>
            <p style="color:var(--gold); letter-spacing:6px; font-size: 14px;">AJARA PREMIUM</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <div class="logo">GenZ<span>foods</span></div>
            <div style="font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 1px;">PREMIUM</div>
        </header>

        <section id="home-page" class="container">
            <div style="background:var(--black); padding:25px; border-radius:25px; color:white; margin-bottom:20px;">
                <h2 style="color:var(--gold); font-size:26px;">GenZ Ajara ✨</h2>
                <p style="opacity:0.8; font-size: 14px;">The town's finest flavors.</p>
            </div>
            <h3 style="margin-bottom:15px; font-weight:900;">20 Premium Hubs</h3>
            <div id="hotel-list"></div>
        </section>

        <section id="menu-page" class="hidden"></section>

        <section id="cart-page" class="container hidden">
            <h2 style="font-weight:900; margin-bottom:15px;">Your Bag</h2>
            <div id="cart-items" style="background:#f9f9f9; border-radius:20px; padding:15px;"></div>
            <h4 style="margin-top:20px;">Address & Location</h4>
            <textarea id="address" placeholder="Bhai address likho..."></textarea>
            <div id="total-val" style="font-size:26px; font-weight:900; text-align:right; margin:20px 0;"></div>
            <button class="order-btn" onclick="app.placeOrder()"><i class="fab fa-whatsapp"></i> SEND ORDER TO WHATSAPP</button>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.nav('home-page')"><i class="fa fa-home"></i>Home</button>
            <button class="nav-item" onclick="app.nav('cart-page')"><i class="fa fa-shopping-bag"></i>Bag</button>
            <button class="nav-item" onclick="location.reload()"><i class="fa fa-refresh"></i>Reset</button>
        </nav>
    </div>

    <div id="toast">
        <span style="font-weight:700;">Added to Bag!</span>
        <div class="toast-btn" onclick="app.nav('cart-page')">VIEW BAG</div>
    </div>

    <script>
        const HOTELS = Array.from({length: 20}, (_, i) => ({
            id: i+1,
            name: ["Burger Club", "Pizza Palace", "Biryani Art", "Cafe Coffee", "Roll Mania", "Sweet Sin", "Desi Dhaba", "Sushi House", "Waffle World", "Grill Steak", "Momo Point", "Pasta Hub", "Juice Bar", "Royal Thali", "Chai Sutta", "The Bakery", "South Tiffin", "Kabab Korner", "Salad Bar", "Ice Creamy"][i % 20],
            img: `https://images.unsplash.com/photo-${[1571091718767, 1513104890138, 1589302168068, 1509042239860, 1534353436294][i % 5]}?w=500`
        }));

        const app = {
            cart: [],
            currentHotel: null,
            userLocation: "Location not shared",

            init() {
                this.getLocation();
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    this.renderHotels();
                }, 3500);
            },

            getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        this.userLocation = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    });
                }
            },

            renderHotels() {
                const list = document.getElementById('hotel-list');
                list.innerHTML = HOTELS.map(h => `
                    <div class="hotel-card animate__animated animate__fadeInUp" onclick="app.openMenu(${h.id})">
                        <img src="${h.img}">
                        <div class="h-info">
                            <span class="rating">★ 4.${(h.id%5)+4}</span>
                            <h4 style="font-weight:900;">${h.name}</h4>
                            <p style="font-size:12px; color:#777;">Premium Choice</p>
                        </div>
                    </div>
                `).join('');
            },

            openMenu(id) {
                const hotel = HOTELS.find(h => h.id == id);
                this.currentHotel = hotel;
                let dishes = "";
                for(let i=1; i<=20; i++) {
                    const price = 100 + (i*10);
                    dishes += `
                        <div class="dish-card">
                            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200" class="dish-img">
                            <div style="flex:1">
                                <h4 style="font-size:14px;">${hotel.name.split(' ')[0]} Spec. #${i}</h4>
                                <b style="color:var(--gold)">₹${price}</b>
                            </div>
                            <button class="add-btn" onclick="app.add('${hotel.name.split(' ')[0]} #${i}', ${price})">ADD +</button>
                        </div>
                    `;
                }
                document.getElementById('menu-page').innerHTML = `
                    <div style="padding:20px; background:var(--black); color:white; display:flex; align-items:center; gap:15px;">
                        <i class="fa fa-arrow-left" onclick="app.nav('home-page')"></i>
                        <h2 style="font-size:18px;">${hotel.name}</h2>
                    </div>
                    <div class="container">${dishes}</div>
                `;
                this.nav('menu-page');
            },

            add(n, p) {
                this.cart.push({n, p, h: this.currentHotel.name});
                const t = document.getElementById('toast');
                t.style.display = 'flex';
                setTimeout(() => t.style.display = 'none', 3000);
            },

            nav(id) {
                ['home-page', 'menu-page', 'cart-page'].forEach(p => document.getElementById(p).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
                if(id === 'cart-page') this.renderCart();
                window.scrollTo(0,0);
            },

            renderCart() {
                const box = document.getElementById('cart-items');
                const val = document.getElementById('total-val');
                if(this.cart.length === 0) { box.innerHTML = "Bag is empty!"; val.innerHTML = ""; return; }
                box.innerHTML = this.cart.map((item, i) => `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                        <div><b>${item.n}</b><br><small>${item.h}</small></div>
                        <b>₹${item.p} <i class="fa fa-trash" style="color:red; margin-left:10px;" onclick="app.remove(${i})"></i></b>
                    </div>
                `).join('');
                val.innerText = `Total: ₹${this.cart.reduce((s, i) => s + i.p, 0)}`;
            },

            remove(i) { this.cart.splice(i, 1); this.renderCart(); },

            placeOrder() {
                const addr = document.getElementById('address').value;
                if(!addr) return alert("Bhai address likho!");
                const items = this.cart.map(i => `• ${i.n} (${i.h}) - ₹${i.p}`).join('\n');
                const total = this.cart.reduce((s, i) => s + i.p, 0);
                const msg = `*GenZfoods Ajara Order*\n---\n*Items:*\n${items}\n\n*Total:* ₹${total}\n*Address:* ${addr}\n\n*Location:* ${this.userLocation}\n\n_Bhai QR code bhejo payment ke liye!_`;
                window.open(`https://wa.me/917757007795?text=${encodeURIComponent(msg)}`);
            }
        };

        app.init();
    </script>
</body>
</html>
